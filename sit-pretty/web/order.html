<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order videos</title>
<style>
:root{--ink:#1d1d1f;--sub:#6b6b78;--line:#e6e6ea;--bg:#f6f6f8;--card:#fff;--acc:#1d1d1f;--ok:#067647;--warn:#B54708;--bad:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:16px;font-family:ui-monospace,Consolas,monospace}
header .sub{color:var(--sub);font-size:12.5px}
.tabs{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer;color:var(--ink)}
.tab[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab .n{opacity:.6;margin-left:4px}
main{padding:12px 16px 24px;max-width:1100px}
.player{background:#000;border-radius:12px;overflow:hidden;position:relative}
.tl{position:relative;height:16px;background:#e3e3e8;border-radius:8px;margin:10px 0 4px;cursor:pointer}
.tl .tlp{position:absolute;left:0;top:0;bottom:0;background:#9a9aa6;border-radius:8px;pointer-events:none}
.tl .tlm{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:#e0302a;border-radius:2px;pointer-events:none}
.tl .tlt{position:absolute;top:-20px;font-size:11px;color:#e0302a;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
#zoomc{position:absolute;cursor:grab;clip-path:inset(0 0 52px 0);touch-action:none}
#zoomc.drag{cursor:grabbing}
#zoomtag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:8px;pointer-events:none}
video{display:block;width:100%;max-height:62vh;background:#000}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:36px;padding:0 12px;font:inherit;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.on,.btn.main{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vid{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.vid[aria-current=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.vid .grow{flex:1;min-width:0}
.vid .meta{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.card h2{margin:0 0 6px;font-size:14px}
.sub{color:var(--sub)}
.job{font-size:13px;margin-top:6px}
.job b.working,.job b.queued,.job b.downloading,.job b.time_found{color:var(--warn)}
.job b.done{color:var(--ok)}.job b.problem{color:var(--bad)}
.mn{width:64px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 6px;font:inherit}
.cams{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.cams label{display:flex;gap:6px;align-items:center;cursor:pointer}
.msg{font-size:13px;margin-top:6px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.empty{color:var(--sub);padding:20px 0;text-align:center}
.pin{max-width:320px;margin:60px auto;text-align:center}
.pin input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;margin:8px 0}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><h1 id="ord">Order</h1><span class="sub" id="hdr"></span></header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-t="simple">Simple view<span class="n" id="n-simple"></span></button>
  <button class="tab" role="tab" data-t="detailed">Detailed packing<span class="n" id="n-detailed"></span></button>
  <button class="tab" role="tab" data-t="unboxing">Unboxing<span class="n" id="n-unboxing"></span></button>
</div>
<main id="main"></main>

<script>
const P=new URLSearchParams(location.search);
const ORDER=(P.get('order')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const SCAN=P.get('scan')||'';           // BigSeller "Scan to ship" time, from the extension (YYYY-MM-DDTHH:MM)
let PIN=P.get('pin')||(()=>{try{return localStorage.getItem('sp-pin')||''}catch(e){return ''}})();
let D=null, tab=P.get('tab')||'', cur='', speed=1, timer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const media=(f,dl,view)=>`/media?order=${encodeURIComponent(ORDER)}&file=${encodeURIComponent(f)}&pin=${encodeURIComponent(PIN)}${dl?'&dl=1':''}${view?'&view=1':''}`;
const vinfo=f=>(D&&D.videos.find(v=>v.file===f))||{};
const playSrc=f=>{const v=vinfo(f);return v.view==='ready'?media(f,0,1):media(f)};
let asked={}, livei=0;
// Instant packing view: the all-day NAS footage around the BigSeller scan, played straight away (no download)
let NAS=null, NASK='', packAt='', nasErr='';
let nascam=(()=>{try{return localStorage.getItem('sp-nascam')||''}catch(e){return ''}})();
const scanT=()=>SCAN||packAt;
const HEVC=(()=>{try{return !!document.createElement('video').canPlayType('video/mp4; codecs="hvc1.1.6.L153.B0"')}catch(e){return false}})();
const nasMins=()=>{let b=5,a=1;try{b=+(localStorage.getItem('sp-nasb')||5);a=+(localStorage.getItem('sp-nasa')||1)}catch(e){}return [b,a]};
async function nasLoad(){const t=scanT();if(!t)return;const [b,a]=nasMins(),k=t+'|'+b+'|'+a;if(k===NASK)return;NASK=k;NAS=null;nasErr='';
  try{NAS=await api(`/api/nascheck?scan=${encodeURIComponent(t)}&before=${b}&after=${a}`)}catch(e){nasErr=e.message}render()}
function nasHTML(){
  if(!scanT()) return `<div class="card"><h2>Watch the packing</h2><div class="sub">When was it packed? (Opened from BigSeller, this is filled in for you.)</div>
    <div class="ctrl"><input type="datetime-local" id="packat" value="${/^\d{6}/.test(ORDER)?'20'+ORDER.slice(0,2)+'-'+ORDER.slice(2,4)+'-'+ORDER.slice(4,6)+'T12:00':''}" style="height:36px;border:1px solid #ccc;border-radius:8px;padding:0 8px;font:inherit"><button class="btn main" id="packgo">Show the packing</button></div></div>`;
  if(nasErr) return `<div class="card"><div class="msg err">${esc(nasErr)}</div></div>`;
  if(!NAS) return `<div class="card" style="text-align:center;padding:24px"><span class="spin"></span> Looking for the NAS footage…</div>`;
  const ok=NAS.cams.filter(c=>c[2]), [b,a]=nasMins();
  const chips=(key,vals,on,unit)=>vals.map(v=>`<button class="btn chip${v===on?' on':''}" data-${key}="${v}">${v}${unit}</button>`).join('');
  const minsRow=`<div class="ctrl"><span class="sub">Minutes before the scan</span>${chips('nasb',[2,5,10,15],b,'')}<span class="sub">after</span>${chips('nasa',[1,3,5],a,'')}</div>`;
  if(!ok.length) return `<div class="card"><h2>Watch the packing</h2><div class="sub">No NAS footage for ${esc(NAS.start)}–${esc(NAS.end.slice(11))} (all-day recording runs Mon–Sat 8:00–18:00 and keeps 45 days). Get the packing clip below instead; it comes from the camera's memory card.</div>${minsRow}</div>`;
  if(!ok.some(c=>c[0]===nascam)) nascam=ok[0][0];
  const src=`/nasview.mp4?cam=${encodeURIComponent(nascam)}&scan=${encodeURIComponent(scanT())}&before=${b}&after=${a}&pin=${encodeURIComponent(PIN)}${HEVC?'':'&phone=1'}`;
  return `<div class="player"><video id="v" controls autoplay muted playsinline preload="auto" src="${src}"></video></div>
    <div class="ctrl"><b>Packing table</b>${ok.map(c=>`<button class="btn chip${c[0]===nascam?' on':''}" data-nascam="${esc(c[0])}">${esc(c[1])}</button>`).join('')}
    <span class="sub">${esc(NAS.start.slice(11))}–${esc(NAS.end.slice(11))}, ${esc(NAS.start.slice(0,10))} · ${HEVC?'starts in a few seconds':'phone copy, ready in about 20-30 seconds'}</span></div>
    <div class="tl" id="tl" data-at="${b*60}"><div class="tlp" id="tlp"></div><div class="tlm" id="tlm"></div><div class="tlt" id="tlt">Scan ${esc(scanT().slice(11,16))}</div></div>
    <div class="ctrl"><button class="btn main" data-jumpscan="1">Jump to the scan (${esc(scanT().slice(11,16))})</button><span class="sub">Speed</span>${[1,2,4,8,16].map(s=>`<button class="btn sp${s===speed?' on':''}" data-sp="${s}">${s}×</button>`).join('')}
    <button class="btn" data-skip="-10">−10 s</button><button class="btn" data-skip="10">+10 s</button></div>${minsRow}
    <div class="ctrl"><span class="sub">Pause where it's clearest, then save a 4K photo:</span><button class="btn" data-nphoto="waybill">Waybill photo</button><button class="btn" data-nphoto="packaging">Box photo</button><button class="btn" data-nphoto="item">Item photo</button></div><div class="msg" id="nphmsg"></div>`;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-nascam]');if(c){nascam=c.dataset.nascam;try{localStorage.setItem('sp-nascam',nascam)}catch(_){}render();return}
  const nb=e.target.closest('[data-nasb]'),na=e.target.closest('[data-nasa]');
  if(nb||na){try{if(nb)localStorage.setItem('sp-nasb',nb.dataset.nasb);if(na)localStorage.setItem('sp-nasa',na.dataset.nasa)}catch(_){}nasLoad();return}
  const js=e.target.closest('[data-jumpscan]');if(js){const v=$('#v'),tl=$('#tl');if(v&&tl){v.currentTime=Math.max(0,+tl.dataset.at-5);v.play().catch(()=>{})}return}
  const tlc=e.target.closest('#tl');if(tlc){const v=$('#v');if(v&&v.duration){const r=tlc.getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*v.duration}return}
  const np=e.target.closest('[data-nphoto]');if(np){const v=$('#v'),m=$('#nphmsg'),[b,a]=nasMins();if(!v)return;v.pause();m.className='msg';m.textContent='Saving the 4K photo…';
    api('/api/photo',{order:ORDER,kind:np.dataset.nphoto,t:v.currentTime,nas:{cam:nascam,scan:scanT(),before:b,after:a}}).then(r=>{m.className='msg ok';m.textContent='Saved in the order folder: '+r.file}).catch(err=>{m.className='msg err';m.textContent=err.message});return}
  if(e.target.closest('#packgo')){const v=($('#packat')||{}).value;if(v){packAt=v;nasLoad();render()}}
});
const phsrc=(f,dl)=>`/photo?order=${encodeURIComponent(ORDER)}&file=${encodeURIComponent(f)}&pin=${encodeURIComponent(PIN)}${dl?'&dl=1':''}`;
const mins=()=>{let b=5,a=1;try{b=+(localStorage.getItem('sp-before')||5);a=+(localStorage.getItem('sp-after1')||1)}catch(e){}return [b,a]};
// minutes-before buttons (1 2 5 8 10 15): the chosen one is dark
function spMinChips(root){(root||document).querySelectorAll('.mchips').forEach(c=>{const i=c.parentElement.querySelector('input[data-o=before],#pmb');if(!i)return;c.querySelectorAll('[data-mb]').forEach(b=>{const on=+b.dataset.mb===+i.value;b.style.background=on?'#1d1d1f':'#fff';b.style.color=on?'#fff':'#1d1d1f';b.style.borderColor=on?'#1d1d1f':'#ccc'})})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-mb]');if(!b)return;e.preventDefault();e.stopPropagation();const c=b.closest('.mchips'),i=c.parentElement.querySelector('input[data-o=before],#pmb');i.value=b.dataset.mb;i.dispatchEvent(new Event('change'));spMinChips(c.parentElement)},true);
const saveMins=(b,a)=>{try{localStorage.setItem('sp-before',b);localStorage.setItem('sp-after1',a)}catch(e){}};

async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Pin':PIN},body:body?JSON.stringify(body):undefined});
  if(r.status===401){askPin();throw new Error('PIN needed')}
  const j=await r.json(); if(!r.ok) throw new Error(j.error||'Something went wrong'); return j;
}
function askPin(){
  $('#main').innerHTML='<div class="pin"><h2>Sit Pretty PIN</h2><input id="pin" type="password" inputmode="numeric" autocomplete="off"><button class="btn main" id="pinok">Open</button></div>';
  $('#pinok').onclick=()=>{PIN=$('#pin').value.trim();try{localStorage.setItem('sp-pin',PIN)}catch(e){};load()};
  $('#pin').focus();
}
const fmtScan=s=>{if(!s)return'';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('en-SG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})};
const JOBTXT={queued:'Waiting for Claude',working:'Claude is making it',time_found:'Downloading',downloading:'Downloading from the camera',done:'Done',problem:'Needs you'};
const KINDTXT={packing:'Detailed packing video',count:'Simple count',clip:'Packing clip',unboxing:'Labelled unboxing'};
function jobHTML(kinds){
  return (D.jobs||[]).filter(j=>kinds.includes(j.kind)&&j.status!=='done').map(j=>`<div class="job">${esc(KINDTXT[j.kind]||j.kind)}: <b class="${esc(j.status)}">${['done','problem'].includes(j.status)?'':'<span class="spin"></span> '}${esc(JOBTXT[j.status]||j.status)}</b>${j.progress?' · '+esc(j.progress):''}${j.problem?'<div class="msg err">'+esc(j.problem)+'</div>':''}</div>`).join('');
}
const busy=kinds=>(D.jobs||[]).some(j=>kinds.includes(j.kind)&&['queued','working','time_found','downloading'].includes(j.status));
function camsHTML(){const [b,a]=mins();return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0">Minutes before the scan <input type="hidden" data-o="before" value="${b}"><span class="mchips" style="display:inline-flex;gap:4px;flex-wrap:wrap"><button type="button" data-mb="1" style="min-width:34px;height:30px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1d1d1f;font:inherit;cursor:pointer">1</button><button type="button" data-mb="2" style="min-width:34px;height:30px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1d1d1f;font:inherit;cursor:pointer">2</button><button type="button" data-mb="5" style="min-width:34px;height:30px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1d1d1f;font:inherit;cursor:pointer">5</button><button type="button" data-mb="8" style="min-width:34px;height:30px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1d1d1f;font:inherit;cursor:pointer">8</button><button type="button" data-mb="10" style="min-width:34px;height:30px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1d1d1f;font:inherit;cursor:pointer">10</button><button type="button" data-mb="15" style="min-width:34px;height:30px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1d1d1f;font:inherit;cursor:pointer">15</button></span> after <input class="mn" type="number" data-o="after" min="0" max="30" value="${a}"></div><div class="cams">${D.packing_cameras.map(c=>`<label><input type="checkbox" value="${esc(c[0])}"> ${esc(c[1])}</label>`).join('')}</div>`}
const pickedCams=root=>[...root.querySelectorAll('.cams input:checked')].map(i=>i.value);

function render(){
  if(!D) return;
  const by={simple:[],detailed:[],unboxing:[]};
  for(const v of D.videos){ if(v.kind==='simple'||v.kind==='count') by.simple.push(v); else if(by[v.kind]) by[v.kind].push(v); }
  for(const k in by) $('#n-'+k).textContent=by[k].length?by[k].length:'';
  if(!tab) tab=by.detailed.length?'detailed':by.simple.length?'simple':by.unboxing.length?'unboxing':'simple';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  const list=by[tab];
  if(!list.some(v=>v.file===cur)) cur=(list.find(v=>v.kind==='count')||list[0]||{}).file||'';
  let h='';
  const cv=vinfo(cur);
  if(cur&&(cv.view==='none'||cv.view==='making')){
    if(cv.view==='none'&&!asked[cur]){asked[cur]=1;api('/api/makeview',{order:ORDER,file:cur}).then(()=>setTimeout(load,1500)).catch(()=>{})}
    h+=`<div class="card" style="text-align:center;padding:30px 12px"><span class="spin"></span> <b>Making a playable copy of this camera recording…</b><div class="sub" style="margin-top:6px">The camera's 4K files don't play in Chrome, so Sit Pretty makes a small copy (about 2 minutes for 15 minutes of footage). It plays here by itself when ready. Download gives the full 4K original now.</div><a class="btn" style="margin-top:10px" href="${media(cur,1)}" download>Download 4K original</a></div>`;
  } else if(cur){
    h+=`<div class="player"><video id="v" controls autoplay muted playsinline preload="metadata" src="${playSrc(cur)}"></video></div>
      <div class="ctrl"><span class="sub">Speed</span>${[1,2,4,8,16].map(s=>`<button class="btn sp${s===speed?' on':''}" data-sp="${s}">${s}×</button>`).join('')}
      <button class="btn" data-skip="-10">−10 s</button><button class="btn" data-skip="10">+10 s</button>
      <a class="btn" href="${media(cur,1)}" download>Download</a></div>`;
  }
  if(list.length>1||(!cur&&list.length)) h+=`<div class="list">${list.map(v=>`<div class="vid" data-f="${esc(v.file)}" aria-current="${v.file===cur}"><div class="grow"><b>${esc(v.label)}</b><div class="meta">${esc(v.at)} · ${v.mb} MB</div></div><a class="btn" href="${media(v.file,1)}" download onclick="event.stopPropagation()">Download</a></div>`).join('')}</div>`;
  if(!list.length&&tab==='simple') h+=nasHTML();
  else if(!list.length) h+=`<div class="empty">${tab==='unboxing'?'No unboxing video for this order yet. Record one on Sit Pretty\'s Unbox page.':tab==='detailed'?'No detailed packing video yet.':'No packing clip yet.'}</div>`;

  const lj=(D.jobs||[]).find(j=>j.kind==='clip'&&j.live&&j.live.length&&['downloading','time_found'].includes(j.status));
  if(tab==='simple'&&lj&&!list.some(v=>v.kind==='simple')){
    if(livei>=lj.live.length) livei=lj.live.length-1;
    const src=media(lj.live[livei],0,1);
    h=`<div class="player"><video id="v" controls autoplay muted playsinline src="${src}"></video></div>
      <div class="ctrl"><b>Live: minute ${livei+1} of ${lj.live_total}</b><span class="sub">(${lj.live.length} ready, the rest is still coming)</span>
      ${[1,2,4,8].map(s=>`<button class="btn sp${s===speed?' on':''}" data-sp="${s}">${s}×</button>`).join('')}
      <button class="btn" data-live="-1"${livei?'':' disabled'}>◀ Minute</button><button class="btn" data-live="1"${livei+1<lj.live.length?'':' disabled'}>Minute ▶</button></div>`;
  }
  if(tab==='simple'){
    const raw=list.filter(v=>v.kind==='simple'), counted=list.some(v=>v.kind==='count');
    h+=jobHTML(['clip','count']);
    if(!raw.length&&!busy(['clip'])){
      h+=`<div class="card" id="getclip"><h2>Get the packing clip</h2><div class="sub">${SCAN?'BigSeller: scanned to ship <b>'+esc(fmtScan(SCAN))+'</b>. Choose how many minutes before and after it the clip covers.':'No BigSeller scan time was passed, so Claude looks it up first.'} Tick the table that packed it (each takes about 4 minutes to download).</div>${camsHTML()}<button class="btn main" id="goclip">Get packing clip</button><div class="msg" id="m1"></div></div>`;
    } else if(raw.length&&!counted&&!busy(['count'])){
      h+=`<div class="card" id="cnt"><h2>Simple count</h2><div class="sub">Claude adds a big ITEMS PACKED counter to the clip (no arrows or name tags). Quicker and cheaper than the detailed video, about 3-5 minutes.</div><button class="btn main" id="gocount">Add simple count</button><div class="msg" id="m2"></div></div>`;
    }
  }
  if(tab==='detailed'){
    h+=jobHTML(['packing']);
    if(!list.length&&!busy(['packing'])){
      h+=`<div class="card" id="det"><h2>Make the detailed packing video</h2><div class="sub">Claude labels every item, the counting, the taping and the waybill (Shopee-ready, about 10-20 minutes).${SCAN?' Scanned to ship <b>'+esc(fmtScan(SCAN))+'</b>.':''}</div>${camsHTML()}<button class="btn main" id="godet">Make detailed video</button><div class="msg" id="m3"></div></div>`;
    }
  }
  if(tab==='unboxing'){ h+=jobHTML(['unboxing']);
    const ph=D.photos||[];
    h+=`<div class="card"><h2>Photos for Shopee <span class="sub" style="font-weight:400">(4K, from the recording)</span></h2>
      ${cur?`<div class="sub">Pause the video where the waybill or the outer box is clearest, then:</div>
      <div class="ctrl"><button class="btn main" data-photo="waybill">Save as waybill photo</button><button class="btn" data-photo="packaging">Save as packaging photo</button><button class="btn" data-photo="item">Save as item photo</button><span class="msg" id="phmsg"></span></div>`:''}
      ${ph.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px">${ph.map(p=>`<div class="vid" style="flex-direction:column;align-items:stretch;cursor:default"><img src="${phsrc(p.file)}" alt="" style="width:100%;border-radius:6px"><div><b>${esc(p.label)}</b><div class="meta">${esc(p.at)} · ${p.mb} MB</div></div><a class="btn" href="${phsrc(p.file,1)}" download>Download</a></div>`).join('')}</div>`:'<div class="sub" style="margin-top:6px">No photos yet.</div>'}</div>`;
  }
  if(D.return&&D.return.appeal) h+=`<div class="card"><h2>Appeal for Shopee <span class="sub" style="font-weight:400">(${D.return.appeal.length} characters)</span></h2><div class="sub" style="white-space:pre-wrap">${esc(D.return.appeal)}</div><button class="btn" id="cpapp" style="margin-top:8px">Copy appeal</button></div>`;

  // keep the playing video when only the status changes
  const v=$('#v'), ns=(h.match(/<video id="v"[^>]*src="([^"]+)"/)||[])[1], keep=v&&ns&&v.getAttribute('src')===ns.replace(/&amp;/g,'&')?{t:v.currentTime,p:!v.paused}:null;
  if(keep){ const old=v.parentElement; $('#main').innerHTML=h; $('#v').parentElement.replaceWith(old); }
  else $('#main').innerHTML=h;
  const nv=$('#v'); if(nv){ nv.playbackRate=speed;
    nv.onended=()=>{ const j=(D.jobs||[]).find(j=>j.kind==='clip'&&j.live&&j.live.length); if(j&&livei+1<j.live.length){ livei++; nv.parentElement.remove(); render(); } }; }
  spMinChips();
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-t]'); if(t){tab=t.dataset.t;cur='';render();return}
  const f=e.target.closest('.vid'); if(f){cur=f.dataset.f;$('#main').querySelector('.player')?.remove();render();return}
  const s=e.target.closest('[data-sp]'); if(s){speed=+s.dataset.sp;const v=$('#v');if(v)v.playbackRate=speed;document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('on',+b.dataset.sp===speed));return}
  const lv=e.target.closest('[data-live]'); if(lv){livei=Math.max(0,livei+ +lv.dataset.live);$('#main').querySelector('.player')?.remove();render();return}
  const k=e.target.closest('[data-skip]'); if(k){const v=$('#v');if(v)v.currentTime=Math.max(0,v.currentTime+ +k.dataset.skip);return}
  const pb=e.target.closest('[data-photo]');
  if(pb){ const v=$('#v'); if(!v||!cur) return; v.pause(); pb.disabled=true; const m=$('#phmsg'); m.className='msg'; m.textContent='Saving the 4K photo…';
    try{ const r=await api('/api/photo',{order:ORDER,file:cur,t:v.currentTime,kind:pb.dataset.photo}); m.className='msg ok'; m.textContent='Saved: '+r.label; await load(); }
    catch(err){ m.className='msg err'; m.textContent=err.message; } pb.disabled=false; return; }
  const id=e.target.id;
  if(id==='goclip'||id==='godet'){
    const box=e.target.closest('.card'), m=box.querySelector('.msg'), cams=pickedCams(box);
    if(!cams.length){m.className='msg err';m.textContent='Tick the table that packed this order.';return}
    const before=+box.querySelector('[data-o=before]').value||5, after=+box.querySelector('[data-o=after]').value||0; saveMins(before,after);
    e.target.disabled=true;
    try{ await api(id==='goclip'?'/api/packclip':'/api/evidence',{order:ORDER,request:(D.return||{}).request||'',cams,scan_time:SCAN,before,after});
      m.className='msg ok';m.textContent='Started.'; await load(); }
    catch(err){m.className='msg err';m.textContent=err.message;e.target.disabled=false}
  }
  if(id==='gocount'){
    const m=$('#m2'), clip=(D.videos.find(v=>v.file===cur&&v.kind==='simple')||D.videos.find(v=>v.kind==='simple')).file;
    e.target.disabled=true;
    try{ await api('/api/count',{order:ORDER,clip,scan_time:SCAN}); await load(); }
    catch(err){m.className='msg err';m.textContent=err.message;e.target.disabled=false}
  }
  if(id==='cpapp'){
    const a=document.createElement('textarea');a.value=D.return.appeal;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();
    e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy appeal',1500);
  }
});

async function load(){
  if(!ORDER){$('#main').innerHTML='<div class="empty">No order ID.</div>';return}
  try{ D=await api('/api/order?order='+encodeURIComponent(ORDER)+(SCAN?'&scan='+encodeURIComponent(SCAN):'')); if(!SCAN&&!packAt&&D.scan) packAt=D.scan; }catch(e){ if(e.message!=='PIN needed') $('#main').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  $('#ord').textContent=ORDER; document.title=ORDER+' videos';
  const r=D.return; $('#hdr').textContent=[r&&r.status?'Return: '+r.status:'',SCAN?'Scanned to ship '+fmtScan(SCAN):''].filter(Boolean).join(' · ');
  render(); nasLoad();
  clearTimeout(timer);
  if(busy(['clip','count','packing','unboxing'])||D.videos.some(v=>v.view==='making'||(v.view==='none'&&v.file===cur))) timer=setTimeout(load,4000);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.close()});
// Zoom: scroll up/down over the video to zoom in/out where the mouse is; drag to move; double-click to reset.
// A canvas over the picture shows the zoomed part; the video's own controls stay usable underneath.
const Z={s:1,sx:0,sy:0,src:'',drag:null,moved:false};
function zEls(){const v=$('#v');if(!v||!v.videoWidth)return null;const p=v.closest('.player');if(!p)return null;
  let c=$('#zoomc');if(!c||c.parentElement!==p){c&&c.remove();c=document.createElement('canvas');c.id='zoomc';c.hidden=true;p.appendChild(c);
    const t=document.createElement('div');t.id='zoomtag';t.hidden=true;p.appendChild(t)}
  const r=v.getBoundingClientRect(),pr=p.getBoundingClientRect(),vw=v.videoWidth,vh=v.videoHeight,k=Math.min(r.width/vw,r.height/vh);
  return {v,c,t:$('#zoomtag'),vw,vh,cw:vw*k,ch:vh*k,ox:r.left-pr.left+(r.width-vw*k)/2,oy:r.top-pr.top+(r.height-vh*k)/2}}
function zClamp(e){const sw=e.vw/Z.s,sh=e.vh/Z.s;Z.sx=Math.min(Math.max(0,Z.sx),e.vw-sw);Z.sy=Math.min(Math.max(0,Z.sy),e.vh-sh)}
function zReset(){Z.s=1;const c=$('#zoomc'),t=$('#zoomtag');if(c)c.hidden=true;if(t)t.hidden=true}
setInterval(()=>{const v=$('#v'),tl=$('#tl');if(!v||!tl||!v.duration)return;const at=+tl.dataset.at;
  $('#tlp').style.width=(v.currentTime/v.duration*100)+'%';const x=Math.min(100,at/v.duration*100)+'%';$('#tlm').style.left=x;$('#tlt').style.left=x},250);
(function zLoop(){const e=zEls();
  if(e){if(Z.src!==e.v.currentSrc){Z.src=e.v.currentSrc;zReset()}
    if(Z.s>1){const c=e.c,d=devicePixelRatio||1;c.hidden=false;e.t.hidden=false;e.t.textContent=Z.s.toFixed(1)+'× · double-click to reset';
      Object.assign(c.style,{left:e.ox+'px',top:e.oy+'px',width:e.cw+'px',height:e.ch+'px'});
      const W=Math.round(e.cw*d),H=Math.round(e.ch*d);if(c.width!==W||c.height!==H){c.width=W;c.height=H}
      zClamp(e);try{c.getContext('2d').drawImage(e.v,Z.sx,Z.sy,e.vw/Z.s,e.vh/Z.s,0,0,W,H)}catch(_){}}}
  requestAnimationFrame(zLoop)})();
document.addEventListener('wheel',ev=>{const pl=ev.target.closest('.player');if(!pl)return;const e=zEls();if(!e)return;
  const pr=pl.getBoundingClientRect(),fx=Math.min(1,Math.max(0,(ev.clientX-pr.left-e.ox)/e.cw)),fy=Math.min(1,Math.max(0,(ev.clientY-pr.top-e.oy)/e.ch));
  ev.preventDefault();
  const px=Z.sx+fx*e.vw/Z.s,py=Z.sy+fy*e.vh/Z.s;   // the spot under the mouse stays put
  Z.s=Math.min(8,Math.max(1,Z.s*(ev.deltaY<0?1.25:0.8)));if(Z.s<1.05){zReset();return}
  Z.sx=px-fx*e.vw/Z.s;Z.sy=py-fy*e.vh/Z.s;zClamp(e)},{passive:false});
document.addEventListener('pointerdown',ev=>{if(ev.target.id!=='zoomc')return;Z.drag={x:ev.clientX,y:ev.clientY};Z.moved=false;ev.target.classList.add('drag');ev.target.setPointerCapture(ev.pointerId)});
document.addEventListener('pointermove',ev=>{if(!Z.drag)return;const e=zEls();if(!e)return;const dx=ev.clientX-Z.drag.x,dy=ev.clientY-Z.drag.y;
  if(Math.abs(dx)+Math.abs(dy)>3)Z.moved=true;Z.sx-=dx/e.cw*e.vw/Z.s;Z.sy-=dy/e.ch*e.vh/Z.s;Z.drag={x:ev.clientX,y:ev.clientY};zClamp(e)});
document.addEventListener('pointerup',ev=>{if(!Z.drag)return;Z.drag=null;const c=$('#zoomc');if(c)c.classList.remove('drag');
  if(!Z.moved&&ev.target.id==='zoomc'){const v=$('#v');if(v)v.paused?v.play():v.pause()}});
document.addEventListener('dblclick',ev=>{if(ev.target.id==='zoomc'){ev.preventDefault();zReset()}});
load();
</script>
