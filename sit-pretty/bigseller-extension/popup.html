<!doctype html>
<html><head><meta charset="utf-8"><title>Sit Pretty</title>
<style>
body{width:280px;margin:0;padding:14px;font:13px/1.4 system-ui,sans-serif;color:#1d1d1f}
h1{font-size:15px;margin:0 0 8px}
label{display:block;margin:8px 0 3px;color:#6b6b78}
input{width:100%;box-sizing:border-box;height:32px;border:1px solid #ccc;border-radius:8px;padding:0 8px;font:inherit}
button{margin-top:10px;width:100%;height:34px;border:0;border-radius:8px;background:#1d1d1f;color:#fff;font:inherit;font-weight:600;cursor:pointer}
#msg{margin-top:8px;min-height:18px}.ok{color:#067647}.err{color:#B42318}
p{color:#6b6b78;font-size:12px;margin:8px 0 0}
</style></head>
<body>
<h1>Sit Pretty for BigSeller</h1>
<label for="host">Sit Pretty address (shop PC name)</label>
<input id="host" placeholder="DESKTOP-ABGC9KO:8787" autocomplete="off">
<label for="pin">Sit Pretty PIN</label>
<input id="pin" type="password" inputmode="numeric" autocomplete="off">
<button id="save">Save and test</button>
<div id="msg"></div>
<p>A camera button shows beside every Shopee order number in BigSeller. Dark with a number = Sit Pretty has videos for it.</p>
<script src="popup.js"></script>
</body></html>
