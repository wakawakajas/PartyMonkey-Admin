# A second copy of Pigu on Cloudflare Pages (https://pigu-2dt.pages.dev),
# kept up to date beside GitHub Pages, which stays the main site. Same files,
# same Supabase. Needs the repo secret CLOUDFLARE_API_TOKEN (a Cloudflare API
# token with Account > Cloudflare Pages > Edit). Without it this job is skipped
# and GitHub Pages is unaffected.
name: Deploy to Cloudflare copy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'macro-studio/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # not a secret: it only names the account, it can't do anything alone
      CLOUDFLARE_ACCOUNT_ID: e8a03eea4a648aa25284a9e1e27bbd0b
    steps:
      - name: Token check
        id: tok
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret yet, skipping"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.tok.outputs.ok == '1'
        uses: actions/checkout@v4
      # the site's files only: notes, SQL and the workflows stay out
      - if: steps.tok.outputs.ok == '1'
        run: |
          mkdir site
          git archive HEAD | tar -x -C site
          rm -rf site/CLAUDE.md site/supabase site/.github site/*.sql
      - if: steps.tok.outputs.ok == '1'
        run: npx -y wrangler@4.40.0 pages deploy site --project-name pigu --branch main --commit-dirty=true
