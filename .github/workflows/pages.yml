# Publishing the site ourselves rather than leaving it to the workflow GitHub
# generates for branch-based Pages. That one broke on 12 Aug 2026: GitHub began
# forcing its actions onto Node 24, whose stricter certificate handling made the
# final "create deployment" API call fail with a self-signed certificate error,
# and being generated it could not be edited. Owning the file is what lets us
# pin versions and pass the flag below.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # so a stuck deploy can be retried without an empty commit

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push always ends up being the one that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the whole repo root, which is what branch-based Pages served before.
      # The .sql files ride along as they always have; nothing secret is in
      # them, and VAPID-KEYS-PRIVATE.txt is gitignored so it never gets here.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        env:
          # Node 24 no longer trusts the runner's injected CA on its own. This
          # is the flag Node's own error message asks for; without it the
          # deployment call fails before it reaches GitHub.
          NODE_OPTIONS: --use-system-ca
